<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>長野市 医療機関マップ</title>
</head>
<body style="margin:0;">
<div id="app-root"></div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<style>
  #app-root, #app-root * { box-sizing: border-box; }
  #app-root {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    color: #222;
    background: #f6f7f5;
    display: flex;
    flex-direction: column;
    height: 100vh;
    min-height: 640px;
  }
  .topbar {
    background: #2c3e35;
    color: #fff;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .topbar h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
  }
  .topbar .sub {
    font-size: 11px;
    color: #c8d3c9;
    margin-top: 2px;
  }
  .topbar-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn {
    background: #3f6b4e;
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: #4f7e5f; }
  .btn.secondary { background: #55606a; }
  .btn.secondary:hover { background: #6a7784; }
  .btn.danger { background: #a94442; }
  .btn.danger:hover { background: #c1554f; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #map { flex: 1; min-width: 0; }
  .sidebar {
    width: 340px;
    min-width: 340px;
    background: #fff;
    border-left: 1px solid #ddd;
    overflow-y: auto;
    padding: 12px;
  }
  .panel {
    background: #fafaf8;
    border: 1px solid #e3e3e0;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  .panel h2 {
    font-size: 12px;
    font-weight: 700;
    margin: 0 0 8px 0;
    color: #3f6b4e;
    letter-spacing: 0.03em;
  }
  .func-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    padding: 3px 0;
    cursor: pointer;
    user-select: none;
  }
  .func-swatch {
    width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0;
    border: 1px solid rgba(0,0,0,0.15);
  }
  .row-flex { display: flex; gap: 6px; align-items: center; }
  .row-flex label { font-size: 12px; color: #555; width: 84px; flex-shrink: 0; }
  input[type=text], input[type=number], select {
    width: 100%;
    font-size: 12.5px;
    padding: 5px 6px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
  }
  .field { margin-bottom: 6px; }
  .field label { display: block; font-size: 11.5px; color: #666; margin-bottom: 2px; }
  .checkbox-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px 8px;
    margin: 6px 0;
  }
  .checkbox-grid label {
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
  }
  .hospital-item {
    border: 1px solid #e6e6e2;
    border-radius: 6px;
    padding: 7px 9px;
    margin-bottom: 6px;
    font-size: 12px;
    background: #fff;
    cursor: pointer;
  }
  .hospital-item:hover { border-color: #3f6b4e; background: #f4f8f5; }
  .hospital-item .hname { font-weight: 600; font-size: 12.5px; }
  .hospital-item .haddr { color: #777; font-size: 11px; margin-top: 1px; }
  .hospital-item .htags { margin-top: 4px; display: flex; gap: 4px; flex-wrap: wrap; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 8px; color: #fff; }
  .small-note { font-size: 10.5px; color: #888; line-height: 1.5; margin-top: 4px; }
  .status-msg { font-size: 11.5px; padding: 6px 8px; border-radius: 5px; margin-top: 6px; }
  .status-msg.ok { background: #e6f2e8; color: #2c6b3f; }
  .status-msg.err { background: #fbe9e7; color: #b0392f; }
  .status-msg.info { background: #eef3fa; color: #35577a; }
  .item-actions { display: flex; gap: 6px; margin-top: 6px; }
  .item-actions .btn { padding: 4px 8px; font-size: 11px; }
  .divider { border-top: 1px dashed #ddd; margin: 8px 0; }
  .leaflet-div-icon.hosp-marker { background: transparent; border: none; }
  .hosp-marker-inner {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 1px 5px rgba(0,0,0,0.55);
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .hosp-marker-total {
    font-size: 9px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 2px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,0.9);
    line-height: 1;
  }
  .hosp-marker-label {
    font-size: 10px;
    font-weight: 700;
    color: #222;
    text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff;
    white-space: nowrap;
    text-align: center;
    margin-top: 1px;
  }
  .hosp-marker-chips {
    display: flex;
    justify-content: center;
    gap: 2px;
    margin-top: 1px;
    flex-wrap: wrap;
    max-width: 70px;
  }
  .bed-chip {
    font-size: 8.5px;
    font-weight: 700;
    color: #fff;
    padding: 0 3px;
    border-radius: 6px;
    line-height: 1.3;
    box-shadow: 0 0 1px rgba(0,0,0,0.5);
    white-space: nowrap;
  }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center; z-index: 10000;
  }
  .modal-box {
    background: #fff; border-radius: 8px; padding: 16px; width: 340px; max-height: 85vh; overflow-y: auto;
  }
  .modal-box h3 { margin: 0 0 10px 0; font-size: 14px; }
  .hint-pin {
    background: #fff3cd; border: 1px solid #ffe08a; color: #6b5300;
    font-size: 11px; padding: 6px 8px; border-radius: 5px; margin-bottom: 8px;
  }
  input[type=file] { font-size: 11.5px; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
(function () {
  "use strict";

  // ---------- 区分定義 ----------
  // 病床種別（重複なく合計可能な分類）
  const BED_TYPE_FUNCS = [
    { key: "一般病床", color: "#2a9d8a" },
    { key: "療養病床", color: "#f4a261" },
    { key: "精神病床", color: "#6a4c93" }
  ];
  // 病床機能報告区分（入力・保存の対象は以下4区分）
  const BED_FUNCTION_FUNCS = [
    { key: "高度急性期", color: "#c0392b" },
    { key: "急性期", color: "#e76f51" },
    { key: "回復期", color: "#457b9d" },
    { key: "慢性期", color: "#8e44ad" }
  ];
  // 病床機能報告の表示用（精神病床など機能報告の対象外病床を「その他」として自動算出し追加）
  const OTHER_FUNC = { key: "その他", color: "#95a5a6" };
  const BED_FUNCTION_DISPLAY_FUNCS = [...BED_FUNCTION_FUNCS, OTHER_FUNC];
  const BED_FUNCTION_DISPLAY_KEYS = BED_FUNCTION_DISPLAY_FUNCS.map(f => f.key);
  // 救急告示区分（病床数ではなく該当有無のフラグ）
  const EMERGENCY_FUNCS = [
    { key: "救急告示", color: "#d62839" },
    { key: "二次救急（病院群輪番制）", color: "#f77f00" },
    { key: "三次救急", color: "#7209b7" }
  ];
  const CLASS_GROUP_LABELS = { bedType: "病床種別", bedFunction: "病床機能報告" };
  const BED_TYPE_KEYS = BED_TYPE_FUNCS.map(f => f.key);
  const BED_FUNCTION_KEYS = BED_FUNCTION_FUNCS.map(f => f.key);
  const EMERGENCY_KEYS = EMERGENCY_FUNCS.map(f => f.key);
  const CENTER_DEFAULT = { name: "長野中央病院", lat: 36.651165, lng: 138.195577 };

  // 「その他」＝許可病床数から病床機能報告4区分の合計を差し引いた残り（精神病床等、機能報告の対象外分の目安）
  function otherBedFunctionCount(h) {
    const sum4 = BED_FUNCTION_KEYS.reduce((s, k) => s + ((h.bedFunction && h.bedFunction[k]) || 0), 0);
    return Math.max(0, (h.licensedBeds || 0) - sum4);
  }
  function getBedFunctionCount(h, key) {
    if (key === "その他") return otherBedFunctionCount(h);
    return (h.bedFunction && h.bedFunction[key]) || 0;
  }

  // 区分変更に伴い過去データは初期化（空の状態から再構築）
  const SEED_DATA = [];

  // ---------- 地区別人口データの指標定義 ----------
  const POP_METRICS = [
    { key: "population", label: "総人口", unit: "人", type: "sequential", colorLow: "#eef3f8", colorHigh: "#08519c", getValue: d => d.population || 0 },
    { key: "pop65", label: "65歳以上人口", unit: "人", type: "sequential", colorLow: "#f5eef8", colorHigh: "#6a1b9a", getValue: d => d.pop65 || 0 },
    { key: "pop75", label: "75歳以上人口", unit: "人", type: "sequential", colorLow: "#fdf2e9", colorHigh: "#a04000", getValue: d => d.pop75 || 0 },
    { key: "agingRate", label: "高齢化率", unit: "%", type: "sequential", colorLow: "#fff5e6", colorHigh: "#cc4c02", getValue: d => districtAgingRate(d) },
    { key: "changeRate2025", label: "人口増減率（2020→2025）", unit: "%", type: "diverging", getValue: d => d.changeRate2025 || 0 },
    { key: "naturalChange", label: "自然増減", unit: "人", type: "diverging", getValue: d => d.naturalChange || 0 },
    { key: "socialChange", label: "社会増減", unit: "人", type: "diverging", getValue: d => d.socialChange || 0 }
  ];
  function districtAgingRate(d) {
    if (!d.population || d.population <= 0) return 0;
    return Math.round(((d.pop65 || 0) / d.population) * 1000) / 10;
  }

  // ---------- 状態 ----------
  let hospitals = [];
  let districts = [];
  let mapClassification = "bedFunction"; // 地図の色分け・集計に使う分類軸（bedType / bedFunction）
  let activeBedType = new Set(BED_TYPE_KEYS);
  let activeBedFunction = new Set(BED_FUNCTION_DISPLAY_KEYS);
  let activeEmergency = new Set(EMERGENCY_KEYS);
  let popLayerVisible = false;
  let popMetric = "population";
  let map, markersLayer, circlesLayer, populationLayer;
  let editingId = null; // 編集中の病院ID（nullなら新規）
  let editingDistrictId = null; // 編集中の地区ID（nullなら新規）
  let pickLatLngMode = false;
  let pickTarget = "hospital"; // "hospital" または "district"

  const root = document.getElementById("app-root");

  root.innerHTML = `
    <div class="topbar">
      <div>
        <h1>長野市 医療機関マップ</h1>
        <div class="sub" id="subTitle">病床数・機能別カラー表示 ／ 長野中央病院からの同心円</div>
      </div>
      <div class="topbar-actions">
        <button class="btn secondary" id="btnRefresh" style="display:none;">更新</button>
        <button class="btn secondary" id="btnImport">Excel取込</button>
        <button class="btn secondary" id="btnExport">Excel書き出し</button>
        <button class="btn" id="btnAddNew">＋ 医療機関を追加</button>
      </div>
    </div>
    <div class="main">
      <div id="map"></div>
      <div class="sidebar">

        <div class="panel">
          <h2>地図の色分け・数字表示</h2>
          <div class="small-note">マーカーの色・数字・円の大きさは「病床機能報告」（高度急性期／急性期／回復期／慢性期／その他）＋許可病床数に基づいて表示されます。</div>
        </div>

        <div class="panel">
          <h2>病床種別で絞り込み</h2>
          <div id="bedTypeFilterList"></div>
        </div>

        <div class="panel">
          <h2>病床機能報告で絞り込み</h2>
          <div id="bedFunctionFilterList"></div>
        </div>

        <div class="panel">
          <h2>救急告示区分で絞り込み</h2>
          <div id="emergencyFilterList"></div>
        </div>

        <div class="panel">
          <h2>同心円（実距離ベース）</h2>
          <div class="field">
            <label>中心点</label>
            <select id="circleCenterSelect"></select>
          </div>
          <div class="row-flex" style="margin-bottom:6px;">
            <label>間隔(km)</label>
            <input type="number" id="circleInterval" value="5" min="0.5" step="0.5" />
          </div>
          <div class="row-flex" style="margin-bottom:6px;">
            <label>本数</label>
            <input type="number" id="circleCount" value="4" min="1" max="15" step="1" />
          </div>
          <label style="font-size:12px; display:flex; align-items:center; gap:6px; cursor:pointer;">
            <input type="checkbox" id="circleToggle" /> 同心円を表示する
          </label>
        </div>

        <div class="panel">
          <h2>医療機関一覧 (<span id="hospCount">0</span>件)</h2>
          <div id="hospitalList"></div>
        </div>

        <div class="panel">
          <h2>地区別人口データ</h2>
          <label style="font-size:12px; display:flex; align-items:center; gap:6px; cursor:pointer; margin-bottom:6px;">
            <input type="checkbox" id="popLayerToggle" /> 人口レイヤーを表示する
          </label>
          <div class="field">
            <label>表示する指標</label>
            <select id="popMetricSelect">
              <option value="population">総人口</option>
              <option value="pop65">65歳以上人口</option>
              <option value="pop75">75歳以上人口</option>
              <option value="agingRate">高齢化率</option>
              <option value="changeRate2025">人口増減率（2020→2025）</option>
              <option value="naturalChange">自然増減</option>
              <option value="socialChange">社会増減（転入超過＋／転出超過－）</option>
            </select>
          </div>
          <div id="popLegend" class="small-note"></div>
          <div class="divider"></div>
          <div class="row-flex" style="gap:6px; margin-bottom:6px;">
            <button class="btn secondary" id="btnImportPop" style="flex:1;">Excel取込</button>
            <button class="btn secondary" id="btnExportPop" style="flex:1;">書き出し</button>
          </div>
          <button class="btn" id="btnAddDistrict" style="width:100%;margin-bottom:8px;">＋ 地区を追加</button>
          <div class="small-note">正式な地区境界データが無いため、円は地区の代表地点を示す簡易表示です（境界データが入手でき次第、正確な塗り分けに差し替え可能です）。</div>
          <div id="districtList" style="margin-top:8px;"></div>
        </div>

        <div id="statusArea"></div>
      </div>
    </div>
  `;

  // ---------- フィルタUI（病床種別／病床機能報告／救急告示区分） ----------
  function buildFilterGroup(containerId, funcs, activeSet, onChangeRerenderAll) {
    const el = document.getElementById(containerId);
    el.innerHTML = "";
    funcs.forEach(f => {
      const row = document.createElement("div");
      row.className = "func-row";
      row.innerHTML = `<input type="checkbox" checked data-key="${f.key}" />
        <span class="func-swatch" style="background:${f.color}"></span>
        <span>${f.key}</span>`;
      row.querySelector("input").addEventListener("change", (e) => {
        if (e.target.checked) activeSet.add(f.key);
        else activeSet.delete(f.key);
        renderMarkers();
        if (onChangeRerenderAll) renderList();
      });
      el.appendChild(row);
    });
  }
  buildFilterGroup("bedTypeFilterList", BED_TYPE_FUNCS, activeBedType, true);
  buildFilterGroup("bedFunctionFilterList", BED_FUNCTION_DISPLAY_FUNCS, activeBedFunction, true);
  buildFilterGroup("emergencyFilterList", EMERGENCY_FUNCS, activeEmergency, true);

  // ---------- 地図初期化 ----------
  map = L.map("map", { zoomControl: true }).setView([CENTER_DEFAULT.lat, CENTER_DEFAULT.lng], 12);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors &copy; CARTO"
  }).addTo(map);
  L.control.scale({ metric: true, imperial: false, position: "bottomleft" }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);
  circlesLayer = L.layerGroup().addTo(map);
  populationLayer = L.layerGroup().addTo(map);

  map.on("click", (e) => {
    if (pickLatLngMode) {
      const latId = pickTarget === "district" ? "d_lat" : "f_lat";
      const lngId = pickTarget === "district" ? "d_lng" : "f_lng";
      const btnId = pickTarget === "district" ? "btnPickOnMapDistrict" : "btnPickOnMap";
      document.getElementById(latId).value = e.latlng.lat.toFixed(6);
      document.getElementById(lngId).value = e.latlng.lng.toFixed(6);
      pickLatLngMode = false;
      const btn = document.getElementById(btnId);
      if (btn) btn.textContent = "地図をクリックして指定";
      showStatus("地図上の位置を取得しました。", "ok");
    }
  });

  // ダブルクリック地点の座標・施設名・住所を自動取得して追加フォームを開く
  map.doubleClickZoom.disable(); // ダブルクリックによるズームは無効化（追加操作を優先）
  map.on("dblclick", async (e) => {
    const lat = e.latlng.lat;
    const lng = e.latlng.lng;
    showStatus("この地点の住所・施設名を検索中…", "info");
    const guess = await reverseGeocodeGuess(lat, lng);
    openEditModal(null, {
      lat: lat.toFixed(6),
      lng: lng.toFixed(6),
      name: guess.name,
      address: guess.address
    });
    if (guess.name) showStatus("施設名を自動推定しました。内容を確認して保存してください。", "ok");
    else showStatus("座標を自動入力しました。施設名は手入力してください。", "info");
  });

  // 逆ジオコーディング（座標→施設名・住所の推定）。OpenStreetMapに地物として
  // 登録されている場合のみ施設名が取得できます。取得できない場合は空文字を返します。
  async function reverseGeocodeGuess(lat, lng) {
    try {
      const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1&accept-language=ja`;
      const resp = await fetch(url, { headers: { "Accept-Language": "ja" } });
      const data = await resp.json();
      let name = "";
      if (data && data.name) name = data.name;
      else if (data && data.namedetails && data.namedetails.name) name = data.namedetails.name;
      let address = "";
      if (data && data.address) {
        const a = data.address;
        address = [
          a.state || "", a.city || a.town || a.county || "",
          a.suburb || a.neighbourhood || "", a.road || "", a.house_number || ""
        ].filter(Boolean).join("");
      }
      return { name, address };
    } catch (err) {
      return { name: "", address: "" };
    }
  }

  // ---------- マーカー描画（分類軸ごとの円グラフ＋数字＋救急バッジ） ----------
  function getVisibleBedEntries(h) {
    // 現在の「地図の色分け・集計基準」（病床種別/病床機能報告）に応じた病床エントリを返す
    if (mapClassification === "bedType") {
      const allSelected = activeBedType.size === BED_TYPE_KEYS.length;
      return BED_TYPE_FUNCS.filter(f => {
        const count = (h.bedType && h.bedType[f.key]) || 0;
        return count > 0 && (allSelected || activeBedType.has(f.key));
      }).map(f => ({ key: f.key, color: f.color, count: (h.bedType && h.bedType[f.key]) || 0 }));
    } else {
      const allSelected = activeBedFunction.size === BED_FUNCTION_DISPLAY_KEYS.length;
      return BED_FUNCTION_DISPLAY_FUNCS.filter(f => {
        const count = getBedFunctionCount(h, f.key);
        return count > 0 && (allSelected || activeBedFunction.has(f.key));
      }).map(f => ({ key: f.key, color: f.color, count: getBedFunctionCount(h, f.key) }));
    }
  }

  function buildPieGradient(entries) {
    if (!entries || entries.length === 0) return "#999";
    const total = entries.reduce((s, e) => s + e.count, 0);
    if (total === 0) return "#999";
    let stops = [];
    let acc = 0;
    entries.forEach(e => {
      const start = (acc / total * 100).toFixed(1);
      acc += e.count;
      const end = (acc / total * 100).toFixed(1);
      stops.push(`${e.color} ${start}% ${end}%`);
    });
    return `conic-gradient(${stops.join(",")})`;
  }

  function bedTypeMatches(h) {
    const allSelected = activeBedType.size === BED_TYPE_KEYS.length;
    if (allSelected) return true;
    return BED_TYPE_KEYS.some(k => activeBedType.has(k) && (h.bedType && h.bedType[k]) > 0);
  }
  function bedFunctionMatches(h) {
    const allSelected = activeBedFunction.size === BED_FUNCTION_DISPLAY_KEYS.length;
    if (allSelected) return true;
    return BED_FUNCTION_DISPLAY_KEYS.some(k => activeBedFunction.has(k) && getBedFunctionCount(h, k) > 0);
  }
  function emergencyMatches(h) {
    const allSelected = activeEmergency.size === EMERGENCY_KEYS.length;
    if (allSelected) return true;
    return EMERGENCY_KEYS.some(k => activeEmergency.has(k) && h.emergency && h.emergency[k]);
  }

  function hospitalMatchesFilter(h) {
    return bedTypeMatches(h) && bedFunctionMatches(h) && emergencyMatches(h);
  }

          <div style="font-size:11px;color:#555;margin-bottom:5px;">許可病床数：${h.licensedBeds || 0}床</div>

  // ---------- 色計算ヘルパー ----------
  function hexToRgb(hex) {
    const m = hex.replace("#", "");
    return { r: parseInt(m.substring(0, 2), 16), g: parseInt(m.substring(2, 4), 16), b: parseInt(m.substring(4, 6), 16) };
  }
  function lerpColor(hex1, hex2, t) {
    const c1 = hexToRgb(hex1), c2 = hexToRgb(hex2);
    const r = Math.round(c1.r + (c2.r - c1.r) * t);
    const g = Math.round(c1.g + (c2.g - c1.g) * t);
    const b = Math.round(c1.b + (c2.b - c1.b) * t);
    return `rgb(${r},${g},${b})`;
  }
  function sequentialColor(value, min, max, colorLow, colorHigh) {
    if (max === min) return colorLow;
    const t = Math.max(0, Math.min(1, (value - min) / (max - min)));
    return lerpColor(colorLow, colorHigh, t);
  }
  function divergingColor(value, maxAbs) {
    if (maxAbs === 0) return "#eeeeee";
    const t = Math.max(-1, Math.min(1, value / maxAbs));
    return t >= 0 ? lerpColor("#f5f5f5", "#2166ac", t) : lerpColor("#f5f5f5", "#b2182b", -t);
  }

  // ---------- 人口レイヤー描画 ----------
  function renderPopulationLayer() {
    populationLayer.clearLayers();
    document.getElementById("popLegend").innerHTML = "";
    if (!popLayerVisible || districts.length === 0) return;
    const metric = POP_METRICS.find(m => m.key === popMetric);
    const values = districts.map(d => metric.getValue(d));
    const min = Math.min(...values, 0);
    const max = Math.max(...values, 0);
    const maxAbs = Math.max(...values.map(v => Math.abs(v)), 1);

    districts.forEach(d => {
      const val = metric.getValue(d);
      const color = metric.type === "diverging" ? divergingColor(val, maxAbs) : sequentialColor(val, min, max, metric.colorLow, metric.colorHigh);
      const circle = L.circle([d.lat, d.lng], { radius: 1300, color: "#666", weight: 1, fillColor: color, fillOpacity: 0.62 });
      const valDisp = metric.unit === "%" ? val.toFixed(1) : Math.round(val);
      circle.bindPopup(`<div style="font-size:12.5px;min-width:170px;">
          <div style="font-weight:700;margin-bottom:3px;">${d.name}</div>
          <div style="font-size:11px;color:#555;">総人口：${d.population || 0}人</div>
          <div style="font-size:11px;color:#555;">65歳以上：${d.pop65 || 0}人／75歳以上：${d.pop75 || 0}人</div>
          <div style="font-size:11px;color:#555;">高齢化率：${districtAgingRate(d)}%</div>
          <div style="font-size:11px;color:#555;">人口増減率(2020→2025)：${d.changeRate2025 || 0}%</div>
          <div style="font-size:11px;color:#555;">自然増減：${d.naturalChange || 0}人／社会増減：${d.socialChange || 0}人（${(d.socialChange || 0) >= 0 ? "転入超過" : "転出超過"}）</div>
          <div style="font-size:11px;color:#3f6b4e;margin-top:4px;">表示中の指標「${metric.label}」：${valDisp}${metric.unit}</div>
        </div>`);
      circle.addTo(populationLayer);
      const label = L.marker([d.lat, d.lng], {
        icon: L.divIcon({
          className: "",
          html: `<div style="font-size:10px;font-weight:700;color:#222;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;text-align:center;white-space:nowrap;">${d.name}</div>`,
          iconSize: [120, 16],
          iconAnchor: [60, 8]
        })
      });
      label.addTo(populationLayer);
    });

    const legend = document.getElementById("popLegend");
    if (metric.type === "diverging") {
      legend.innerHTML = `<div style="height:10px;border-radius:3px;background:linear-gradient(to right, ${lerpColor("#f5f5f5", "#b2182b", 1)}, #f5f5f5, ${lerpColor("#f5f5f5", "#2166ac", 1)});"></div>
        <div style="display:flex;justify-content:space-between;margin-top:2px;"><span>-${maxAbs}${metric.unit}</span><span>0</span><span>+${maxAbs}${metric.unit}</span></div>`;
    } else {
      legend.innerHTML = `<div style="height:10px;border-radius:3px;background:linear-gradient(to right, ${metric.colorLow}, ${metric.colorHigh});"></div>
        <div style="display:flex;justify-content:space-between;margin-top:2px;"><span>${min}${metric.unit}</span><span>${max}${metric.unit}</span></div>`;
    }
  }

  // ---------- API連携（Google Sheets + Apps Script）----------
  // Apps Scriptで発行したウェブアプリURLをここに貼り付けてください。
  // 空欄のままなら従来どおりブラウザ内保存（localStorage / window.storage）で動作します。
  const API_URL = "https://script.google.com/macros/s/AKfycbxjWK-YttchbEP9p1Xv2SkOhwuqtvTocE9haRlkHm52-RiGIQreCuZ306O6fZZpnjf1yQ/exec";
  const useApi = !!(API_URL && API_URL.indexOf("https://script.google.com/") === 0);
  const AUTO_REFRESH_MS = 30000; // 他の人の更新を反映する間隔（ミリ秒）

  async function apiGetAll() {
    const res = await fetch(API_URL, { method: "GET" });
    const json = await res.json();
    if (json.status !== "ok") throw new Error(json.message || "API error");
    return { hospitals: json.hospitals || [], districts: json.districts || [] };
  }
  async function apiUpsert(hospital) {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // CORSプリフライト回避のためtext/plainで送信
      body: JSON.stringify({ action: "upsert", hospital })
    });
    const json = await res.json();
    if (json.status !== "ok") throw new Error(json.message || "API error");
  }
  async function apiDelete(id) {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "delete", id })
    });
    const json = await res.json();
    if (json.status !== "ok") throw new Error(json.message || "API error");
  }
  async function apiUpsertDistrict(district) {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "upsertDistrict", district })
    });
    const json = await res.json();
    if (json.status !== "ok") throw new Error(json.message || "API error");
  }
  async function apiDeleteDistrict(id) {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "deleteDistrict", id })
    });
    const json = await res.json();
    if (json.status !== "ok") throw new Error(json.message || "API error");
  }

  // ---------- 永続化 ----------
  // Claude.aiのartifact内ではwindow.storage（アカウント紐づけの永続保存）を使い、
  // それ以外の環境（Cloudflare Workers / GitHub Pages等にデプロイした場合）では
  // ブラウザのlocalStorage（この端末・このブラウザにのみ保存）に自動的に切り替わります。
  const STORAGE_KEY = "nagano_medical_hospitals_v2"; // 区分スキーマ変更のためv2に更新（旧データは読み込まれません）
  const DISTRICT_STORAGE_KEY = "nagano_medical_districts_v1";
  const hasClaudeStorage = (typeof window.storage !== "undefined" && window.storage && typeof window.storage.get === "function");

  // saveData()は「APIモードではない場合のみ」ブラウザ内保存を行います。
  // APIモード時は各操作（追加/編集/削除）の箇所で個別にapiUpsert/apiDelete等を呼びます。
  async function saveData() {
    if (useApi) return;
    try {
      if (hasClaudeStorage) {
        await window.storage.set(STORAGE_KEY, JSON.stringify(hospitals), false);
        await window.storage.set(DISTRICT_STORAGE_KEY, JSON.stringify(districts), false);
      } else {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(hospitals));
        localStorage.setItem(DISTRICT_STORAGE_KEY, JSON.stringify(districts));
      }
    } catch (err) {
      console.error("保存エラー", err);
      showStatus("保存に失敗しました（ブラウザストレージのエラー）。", "err");
    }
  }

  async function loadData(isRefresh) {
    try {
      if (useApi) {
        const result = await apiGetAll();
        hospitals = result.hospitals;
        districts = result.districts;
        if (!isRefresh) showStatus("スプレッドシートから読み込みました（共有モード）。", "info");
      } else if (hasClaudeStorage) {
        const res = await window.storage.get(STORAGE_KEY, false);
        const dres = await window.storage.get(DISTRICT_STORAGE_KEY, false).catch(() => null);
        if (res && res.value) {
          hospitals = JSON.parse(res.value);
          showStatus("保存済みデータを読み込みました。", "info");
        } else {
          hospitals = SEED_DATA.slice();
        }
        districts = (dres && dres.value) ? JSON.parse(dres.value) : [];
        await saveData();
      } else {
        const raw = localStorage.getItem(STORAGE_KEY);
        const draw = localStorage.getItem(DISTRICT_STORAGE_KEY);
        if (raw) {
          hospitals = JSON.parse(raw);
          showStatus("この端末に保存済みのデータを読み込みました。", "info");
        } else {
          hospitals = SEED_DATA.slice();
        }
        districts = draw ? JSON.parse(draw) : [];
        await saveData();
      }
    } catch (err) {
      console.error(err);
      if (useApi) {
        showStatus("スプレッドシートへの接続に失敗しました。API_URLの設定を確認してください。", "err");
        if (!hospitals || hospitals.length === 0) hospitals = SEED_DATA.slice();
        if (!districts) districts = [];
      } else {
        hospitals = SEED_DATA.slice();
        districts = [];
      }
    }
    renderAll();
  }

    const emergencyInputsHtml = EMERGENCY_FUNCS.map(f => {
      const checked = hospital && hospital.emergency && hospital.emergency[f.key] ? "checked" : "";
      return `<label class="func-row"><input type="checkbox" data-emgkey="${f.key}" ${checked}/>
        <span class="func-swatch" style="background:${f.color}"></span>${f.key}</label>`;
    }).join("");

    overlay.innerHTML = `
      <div class="modal-box">
        <h3>${hospital ? "医療機関を編集" : "医療機関を追加"}</h3>
        <div class="hint-pin">緯度・経度は「地図をクリックして指定」ボタンを押してから地図上の位置をクリックすると自動入力されます。住所検索も利用できます。地図をダブルクリックすると、その地点の座標付きでこのフォームが開きます。</div>
        <div class="field"><label>病院名</label><input type="text" id="f_name" value="${initName}" /></div>
        <div class="field"><label>住所</label><input type="text" id="f_address" value="${initAddress}" /></div>
        <div class="row-flex" style="margin-bottom:6px;">
          <button class="btn secondary" id="btnGeocode" style="flex:1;">住所から緯度経度を検索</button>
        </div>
        <div class="field"><label>緯度 (lat)</label><input type="text" id="f_lat" value="${initLat}" /></div>
        <div class="field"><label>経度 (lng)</label><input type="text" id="f_lng" value="${initLng}" /></div>
        <button class="btn secondary" id="btnPickOnMap" style="width:100%;margin-bottom:8px;">地図をクリックして指定</button>
        <div class="field">
          <label>許可病床数（総数）</label>
          <input type="number" min="0" step="1" id="f_licensedBeds" value="${initLicensedBeds}" />
        </div>
        <div class="field">
          <label>病床種別</label>
          ${bedTypeInputsHtml}
        </div>
        <div class="field">
          <label>病床機能報告</label>
          ${bedFunctionInputsHtml}
        </div>
        <div class="field">
          <label>救急告示区分（該当するものにチェック）</label>
          ${emergencyInputsHtml}
        </div>
        <div class="divider"></div>
        <div class="row-flex" style="justify-content:flex-end;gap:8px;">
          <button class="btn secondary" id="btnCancel">キャンセル</button>
          <button class="btn" id="btnSave">保存</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    document.getElementById("btnCancel").addEventListener("click", () => { pickLatLngMode = false; overlay.remove(); });
    document.getElementById("btnPickOnMap").addEventListener("click", (e) => {
      pickTarget = "hospital";
      pickLatLngMode = !pickLatLngMode;
      e.target.textContent = pickLatLngMode ? "地図をクリックしてください…" : "地図をクリックして指定";
    });

    document.getElementById("btnGeocode").addEventListener("click", async () => {
      const addr = document.getElementById("f_address").value.trim();
      if (!addr) { showStatus("住所を入力してください。", "err"); return; }
      const btn = document.getElementById("btnGeocode");
      btn.disabled = true; btn.textContent = "検索中…";
      try {
        const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(addr + " 長野県");
        const resp = await fetch(url, { headers: { "Accept-Language": "ja" } });
        const data = await resp.json();
        if (data && data.length > 0) {
          document.getElementById("f_lat").value = parseFloat(data[0].lat).toFixed(6);
          document.getElementById("f_lng").value = parseFloat(data[0].lon).toFixed(6);
          showStatus("住所から座標を取得しました。地図で位置を確認してください。", "ok");
        } else {
          showStatus("住所が見つかりませんでした。地図クリックか手入力で座標を指定してください。", "err");
        }
      } catch (err) {
        showStatus("住所検索に失敗しました（通信エラー）。地図クリックか手入力で指定してください。", "err");
      }
      btn.disabled = false; btn.textContent = "住所から緯度経度を検索";
    });

    document.getElementById("btnSave").addEventListener("click", () => {
      const name = document.getElementById("f_name").value.trim();
      const address = document.getElementById("f_address").value.trim();
      const lat = parseFloat(document.getElementById("f_lat").value);
      const lng = parseFloat(document.getElementById("f_lng").value);
      if (!name) { showStatus("医療機関名を入力してください。", "err"); return; }
      if (isNaN(lat) || isNaN(lng)) { showStatus("緯度・経度を指定してください。", "err"); return; }
      const licensedBeds = parseInt(document.getElementById("f_licensedBeds").value, 10) || 0;
      const bedType = {};
      overlay.querySelectorAll("[data-bedtypekey]").forEach(inp => {
        const v = parseInt(inp.value, 10);
        bedType[inp.getAttribute("data-bedtypekey")] = isNaN(v) || v < 0 ? 0 : v;
      });
      const bedFunction = {};
      overlay.querySelectorAll("[data-bedfunckey]").forEach(inp => {
        const v = parseInt(inp.value, 10);
        bedFunction[inp.getAttribute("data-bedfunckey")] = isNaN(v) || v < 0 ? 0 : v;
      });
      const emergency = {};
      overlay.querySelectorAll("[data-emgkey]").forEach(cb => {
        emergency[cb.getAttribute("data-emgkey")] = cb.checked;
      });

      let targetHospital;
      if (editingId) {
        targetHospital = hospitals.find(x => x.id === editingId);
        Object.assign(targetHospital, { name, address, lat, lng, licensedBeds, bedType, bedFunction, emergency, approx: false });
      } else {
        targetHospital = { id: "h_" + Date.now(), name, address, lat, lng, licensedBeds, bedType, bedFunction, emergency, approx: false };
        hospitals.push(targetHospital);
      }
      renderAll();
      pickLatLngMode = false;
      overlay.remove();

      if (useApi) {
        apiUpsert(targetHospital)
          .then(() => showStatus("スプレッドシートに保存しました。", "ok"))
          .catch(err => showStatus("保存の同期に失敗しました: " + err.message, "err"));
      } else {
        saveData();
        showStatus("保存しました。", "ok");
      }
    });
  }

  document.getElementById("btnAddNew").addEventListener("click", () => openEditModal(null));

  // ---------- 地区（人口データ）の追加・編集モーダル ----------
  function openDistrictModal(district) {
    editingDistrictId = district ? district.id : null;
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-box">
        <h3>${district ? "地区を編集" : "地区を追加"}</h3>
        <div class="hint-pin">緯度・経度は「地図をクリックして指定」ボタンを押してから地図上の代表地点をクリックすると自動入力されます。</div>
        <div class="field"><label>地区名</label><input type="text" id="d_name" value="${district ? district.name : ""}" /></div>
        <div class="field"><label>緯度 (lat)</label><input type="text" id="d_lat" value="${district ? district.lat : ""}" /></div>
        <div class="field"><label>経度 (lng)</label><input type="text" id="d_lng" value="${district ? district.lng : ""}" /></div>
        <button class="btn secondary" id="btnPickOnMapDistrict" style="width:100%;margin-bottom:8px;">地図をクリックして指定</button>
        <div class="field"><label>総人口</label><input type="number" min="0" step="1" id="d_population" value="${district ? (district.population || 0) : 0}" /></div>
        <div class="field"><label>65歳以上人口</label><input type="number" min="0" step="1" id="d_pop65" value="${district ? (district.pop65 || 0) : 0}" /></div>
        <div class="field"><label>75歳以上人口</label><input type="number" min="0" step="1" id="d_pop75" value="${district ? (district.pop75 || 0) : 0}" /></div>
        <div class="small-note" style="margin-bottom:8px;">高齢化率は総人口・65歳以上人口から自動計算されます。</div>
        <div class="field"><label>人口増減率（2020→2025、%）</label><input type="number" step="0.1" id="d_changeRate" value="${district ? (district.changeRate2025 || 0) : 0}" /></div>
        <div class="field"><label>自然増減（人）</label><input type="number" step="1" id="d_natural" value="${district ? (district.naturalChange || 0) : 0}" /></div>
        <div class="field"><label>社会増減（人、＋は転入超過／－は転出超過）</label><input type="number" step="1" id="d_social" value="${district ? (district.socialChange || 0) : 0}" /></div>
        <div class="divider"></div>
        <div class="row-flex" style="justify-content:flex-end;gap:8px;">
          <button class="btn secondary" id="btnCancelDistrict">キャンセル</button>
          <button class="btn" id="btnSaveDistrict">保存</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    document.getElementById("btnCancelDistrict").addEventListener("click", () => { pickLatLngMode = false; overlay.remove(); });
    document.getElementById("btnPickOnMapDistrict").addEventListener("click", (e) => {
      pickTarget = "district";
      pickLatLngMode = !pickLatLngMode;
      e.target.textContent = pickLatLngMode ? "地図をクリックしてください…" : "地図をクリックして指定";
    });

    document.getElementById("btnSaveDistrict").addEventListener("click", () => {
      const name = document.getElementById("d_name").value.trim();
      const lat = parseFloat(document.getElementById("d_lat").value);
      const lng = parseFloat(document.getElementById("d_lng").value);
      if (!name) { showStatus("地区名を入力してください。", "err"); return; }
      if (isNaN(lat) || isNaN(lng)) { showStatus("緯度・経度を指定してください。", "err"); return; }
      const population = parseInt(document.getElementById("d_population").value, 10) || 0;
      const pop65 = parseInt(document.getElementById("d_pop65").value, 10) || 0;
      const pop75 = parseInt(document.getElementById("d_pop75").value, 10) || 0;
      const changeRate2025 = parseFloat(document.getElementById("d_changeRate").value) || 0;
      const naturalChange = parseInt(document.getElementById("d_natural").value, 10) || 0;
      const socialChange = parseInt(document.getElementById("d_social").value, 10) || 0;

      let target;
      if (editingDistrictId) {
        target = districts.find(x => x.id === editingDistrictId);
        Object.assign(target, { name, lat, lng, population, pop65, pop75, changeRate2025, naturalChange, socialChange });
      } else {
        target = { id: "d_" + Date.now(), name, lat, lng, population, pop65, pop75, changeRate2025, naturalChange, socialChange };
        districts.push(target);
      }
      renderAll();
      pickLatLngMode = false;
      overlay.remove();

      if (useApi) {
        apiUpsertDistrict(target)
          .then(() => showStatus("スプレッドシートに保存しました。", "ok"))
          .catch(err => showStatus("保存の同期に失敗しました: " + err.message, "err"));
      } else {
        saveData();
        showStatus("保存しました。", "ok");
      }
    });
  }

  document.getElementById("btnAddDistrict").addEventListener("click", () => openDistrictModal(null));

  document.getElementById("popLayerToggle").addEventListener("change", (e) => {
    popLayerVisible = e.target.checked;
    renderPopulationLayer();
  });
  document.getElementById("popMetricSelect").addEventListener("change", (e) => {
    popMetric = e.target.value;
    renderPopulationLayer();
  });

  // ---------- 地区データのExcel取込・書き出し ----------
  document.getElementById("btnImportPop").addEventListener("click", () => {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".xlsx,.xls";
    input.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
      let headerIdx = rows.findIndex(r => r.some(c => String(c).includes("地区名")));
      if (headerIdx === -1) headerIdx = 0;
      const header = rows[headerIdx].map(c => String(c).trim());
      const nameCol = header.findIndex(c => c.includes("地区名"));
      const popCol = header.findIndex(c => c.includes("総人口"));
      const pop65Col = header.findIndex(c => c.includes("65歳以上"));
      const pop75Col = header.findIndex(c => c.includes("75歳以上"));
      const changeCol = header.findIndex(c => c.includes("増減率"));
      const naturalCol = header.findIndex(c => c.includes("自然増減"));
      const socialCol = header.findIndex(c => c.includes("社会増減"));
      if (nameCol === -1) { showStatus("「地区名」列が見つかりませんでした。", "err"); return; }

      const dataRows = rows.slice(headerIdx + 1).filter(r => r[nameCol] && String(r[nameCol]).trim());
      showStatus(`${dataRows.length}件を取込中…（地区名から座標を検索しています）`, "info");

      function num(v) { const n = parseFloat(String(v || "").trim()); return isNaN(n) ? 0 : n; }

      let added = 0, failed = 0, failedIndex = 0;
      for (const r of dataRows) {
        const name = String(r[nameCol]).trim();
        if (districts.some(d => d.name === name)) continue;
        const population = popCol !== -1 ? Math.round(num(r[popCol])) : 0;
        const pop65 = pop65Col !== -1 ? Math.round(num(r[pop65Col])) : 0;
        const pop75 = pop75Col !== -1 ? Math.round(num(r[pop75Col])) : 0;
        const changeRate2025 = changeCol !== -1 ? num(r[changeCol]) : 0;
        const naturalChange = naturalCol !== -1 ? Math.round(num(r[naturalCol])) : 0;
        const socialChange = socialCol !== -1 ? Math.round(num(r[socialCol])) : 0;

        let lat = null, lng = null;
        const byName = await geocodeQuery(name + " 長野市 長野県");
        if (byName) { lat = byName.lat; lng = byName.lng; }
        if (lat === null) {
          const angle = (failedIndex * 47) * Math.PI / 180;
          lat = CENTER_DEFAULT.lat + Math.cos(angle) * 0.02;
          lng = CENTER_DEFAULT.lng + Math.sin(angle) * 0.02;
          failed++;
          failedIndex++;
        }

        const newDistrict = { id: "d_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7), name, lat, lng, population, pop65, pop75, changeRate2025, naturalChange, socialChange };
        districts.push(newDistrict);
        if (useApi) {
          try { await apiUpsertDistrict(newDistrict); } catch (err) { showStatus("「" + name + "」の同期に失敗しました。", "err"); }
        }
        added++;
      }
      if (!useApi) await saveData();
      renderAll();
      let msg = `取込完了：${added}件追加`;
      if (failed > 0) msg += `（うち${failed}件は座標が特定できず仮配置。編集画面で修正してください）`;
      showStatus(msg, failed > 0 ? "err" : "ok");
    };
    input.click();
  });

  document.getElementById("btnExportPop").addEventListener("click", () => {
    const header = ["地区名", "総人口", "65歳以上人口", "75歳以上人口", "高齢化率(%)", "人口増減率2020-2025(%)", "自然増減", "社会増減", "緯度", "経度"];
    const rows = districts.map(d => [
      d.name, d.population || 0, d.pop65 || 0, d.pop75 || 0, districtAgingRate(d),
      d.changeRate2025 || 0, d.naturalChange || 0, d.socialChange || 0, d.lat, d.lng
    ]);
    const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "地区別人口");
    XLSX.writeFile(wb, "長野市地区別人口.xlsx");
  });

  // ---------- 同心円コントロールの変更監視 ----------
  ["circleCenterSelect", "circleInterval", "circleCount", "circleToggle"].forEach(id => {
    document.getElementById(id).addEventListener("change", renderCircles);
    document.getElementById(id).addEventListener("input", renderCircles);
  });

  // 住所または施設名の文字列から緯度経度を検索する共通ヘルパー
  // Nominatim利用ポリシーに配慮し、呼び出し後に約1.1秒のウェイトを入れます
  async function geocodeQuery(queryText) {
    try {
      const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(queryText);
      const resp = await fetch(url, { headers: { "Accept-Language": "ja" } });
      const geo = await resp.json();
      await new Promise(res => setTimeout(res, 1100));
      if (geo && geo.length > 0) {
        return { lat: parseFloat(geo[0].lat), lng: parseFloat(geo[0].lon) };
      }
      return null;
    } catch (err) {
      await new Promise(res => setTimeout(res, 1100));
      return null;
    }
  }

  // ---------- Excel取込 ----------
  document.getElementById("btnImport").addEventListener("click", () => {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".xlsx,.xls";
    input.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
      // ヘッダー行を探す（「病院名」または「医療機関名」を含む行）
      let headerIdx = rows.findIndex(r => r.some(c => String(c).includes("病院名") || String(c).includes("医療機関名")));
      if (headerIdx === -1) headerIdx = 0;
      const header = rows[headerIdx].map(c => String(c).trim());
      const nameCol = header.findIndex(c => c.includes("病院名") || c.includes("医療機関名"));
      const addrCol = header.findIndex(c => c.includes("住所"));
      const licensedCol = header.findIndex(c => c.includes("許可病床数"));
      const bedTypeCols = {};
      BED_TYPE_KEYS.forEach(k => { const idx = header.findIndex(c => c === k); if (idx !== -1) bedTypeCols[k] = idx; });
      const bedFunctionCols = {};
      BED_FUNCTION_KEYS.forEach(k => { const idx = header.findIndex(c => c === k); if (idx !== -1) bedFunctionCols[k] = idx; });
      const emergencyCols = {};
      EMERGENCY_KEYS.forEach(k => { const idx = header.findIndex(c => c === k); if (idx !== -1) emergencyCols[k] = idx; });
      if (nameCol === -1) { showStatus("「病院名」列が見つかりませんでした。", "err"); return; }

      const dataRows = rows.slice(headerIdx + 1).filter(r => r[nameCol] && String(r[nameCol]).trim());
      showStatus(`${dataRows.length}件を取込中…（施設名・住所から座標を検索しています）`, "info");

      function parseBedNum(raw) {
        const s = String(raw || "").trim();
        if (s === "") return 0;
        const n = parseFloat(s.replace(/[^\d.]/g, ""));
        return (!isNaN(n) && n > 0) ? Math.round(n) : 0;
      }
      function parseFlag(raw) {
        return String(raw || "").trim() !== "";
      }

      let added = 0, failed = 0, failedIndex = 0;
      for (const r of dataRows) {
        const name = String(r[nameCol]).trim();
        const address = addrCol !== -1 ? String(r[addrCol] || "").trim() : "";
        if (hospitals.some(h => h.name === name)) continue; // 重複スキップ

        const licensedBeds = licensedCol !== -1 ? parseBedNum(r[licensedCol]) : 0;
        const bedType = {}; BED_TYPE_KEYS.forEach(k => { bedType[k] = bedTypeCols[k] !== undefined ? parseBedNum(r[bedTypeCols[k]]) : 0; });
        const bedFunction = {}; BED_FUNCTION_KEYS.forEach(k => { bedFunction[k] = bedFunctionCols[k] !== undefined ? parseBedNum(r[bedFunctionCols[k]]) : 0; });
        const emergency = {}; EMERGENCY_KEYS.forEach(k => { emergency[k] = emergencyCols[k] !== undefined ? parseFlag(r[emergencyCols[k]]) : false; });

        let lat = null, lng = null, approx = true;

        // ① まず施設名で検索（OSMに施設として登録されていれば高確率でヒットする）
        const byName = await geocodeQuery(name + " 長野県");
        if (byName) { lat = byName.lat; lng = byName.lng; approx = false; }

        // ② ダメなら住所で検索（日本の詳細住所はヒット率が低め）
        if (lat === null && address) {
          const byAddr = await geocodeQuery(address + " 長野県");
          if (byAddr) { lat = byAddr.lat; lng = byAddr.lng; approx = false; }
        }

        if (lat === null) {
          // 検索失敗：長野中央病院を中心に少しずつ角度をずらして仮配置（重なり防止・要修正の目印）
          const angle = (failedIndex * 47) * Math.PI / 180;
          lat = CENTER_DEFAULT.lat + Math.cos(angle) * 0.012;
          lng = CENTER_DEFAULT.lng + Math.sin(angle) * 0.012;
          approx = true;
          failed++;
          failedIndex++;
        }

        const newHospital = { id: "h_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7), name, address, lat, lng, licensedBeds, bedType, bedFunction, emergency, approx };
        hospitals.push(newHospital);
        if (useApi) {
          try { await apiUpsert(newHospital); } catch (err) { showStatus("「" + name + "」の同期に失敗しました。", "err"); }
        }
        added++;
      }
      if (!useApi) await saveData();
      renderAll();
      let msg = `取込完了：${added}件追加`;
      if (failed > 0) msg += `（うち${failed}件は座標が特定できず仮配置。編集画面で修正してください）`;
      showStatus(msg, failed > 0 ? "err" : "ok");
    };
    input.click();
  });

  // ---------- Excel書き出し ----------
  document.getElementById("btnExport").addEventListener("click", () => {
    const header = ["病院名", "住所", "許可病床数", ...BED_TYPE_KEYS, ...BED_FUNCTION_KEYS, ...EMERGENCY_KEYS, "緯度", "経度"];
    const rows = hospitals.map(h => [
      h.name, h.address || "", h.licensedBeds || 0,
      ...BED_TYPE_KEYS.map(k => (h.bedType && h.bedType[k]) || 0),
      ...BED_FUNCTION_KEYS.map(k => (h.bedFunction && h.bedFunction[k]) || 0),
      ...EMERGENCY_KEYS.map(k => (h.emergency && h.emergency[k]) ? "〇" : ""),
      h.lat, h.lng
    ]);
    const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "医療機関一覧");
    XLSX.writeFile(wb, "長野市医療機関一覧.xlsx");
  });

  // ---------- 共有モード：更新ボタン＆自動更新 ----------
  if (useApi) {
    const refreshBtn = document.getElementById("btnRefresh");
    refreshBtn.style.display = "";
    refreshBtn.addEventListener("click", () => loadData(true));
    setInterval(() => loadData(true), AUTO_REFRESH_MS);
    document.getElementById("subTitle").textContent += "／ 共有モード（スプレッドシート連携・自動更新あり）";
  }

  // ---------- 初期ロード ----------
  loadData();

})();
</script>
</body>
</html>
